name: Build

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --all-targets

      - name: Run tests
        run: cargo test --release --all-targets

      - name: Package binary
        shell: bash
        run: |
          tar -czf "meta-repo-${{ runner.os }}-${{ runner.arch }}.tar.gz" -C target/release meta-repo

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: meta-repo-${{ runner.os }}-${{ runner.arch }}
          path: meta-repo-${{ runner.os }}-${{ runner.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
