[package]
name = "meta-repo"
version = "0.1.0"
edition = "2024"
description = "Manage multiple Git repositories in parallel"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
